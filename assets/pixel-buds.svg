    <path d="M112 194 H288" stroke="#111111" stroke-width="10" />
    <!-- LED dot -->
    <circle cx="200" cy="232" r="5" fill="#4ADE80" stroke-width="3" />
    <!-- Musical note doodles -->
    <path d="M74 128 V86 L98 80 V118" stroke="#FF6B6B" stroke-width="5" />
    <circle cx="68" cy="130" r="8" fill="#FF6B6B" stroke-width="4" />
