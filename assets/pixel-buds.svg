      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4.5" />
    </filter>
  </defs>
  <rect width="400" height="400" fill="#F6F6F6" />
  <path d="M0 80 H400 M0 160 H400 M0 240 H400 M0 320 H400" stroke="#E2E8F0" stroke-width="2" />
