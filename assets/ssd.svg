<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <filter id="wobble" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4.5" />
    </filter>
  </defs>
  <rect width="400" height="400" fill="#F6F6F6" />
  <path d="M0 80 H400 M0 160 H400 M0 240 H400 M0 320 H400" stroke="#E2E8F0" stroke-width="2" />
  <g filter="url(#wobble)" stroke="#111111" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-24 200 200)">
    <!-- M.2 NVMe PCB -->
    <rect x="62" y="142" width="276" height="114" rx="8" fill="#3B82F6" />
    <!-- Gold M-key pins -->
    <rect x="38" y="158" width="28" height="58" rx="3" fill="#FFD93D" />
    <rect x="38" y="226" width="28" height="22" rx="3" fill="#FFD93D" />
    <path d="M46 168 H60 M46 180 H60 M46 192 H60 M46 204 H60" stroke="#B45309" stroke-width="3.5" />
    <!-- Memory chips -->
    <rect x="94" y="160" width="66" height="78" rx="4" fill="#2B2D42" />
    <rect x="176" y="160" width="66" height="78" rx="4" fill="#2B2D42" />
    <rect x="258" y="168" width="54" height="62" rx="4" fill="#FF6B6B" />
    <!-- Marker scribble highlights -->
    <path d="M104 174 H146 M186 174 H228 M268 184 H300" stroke="#FFFFFF" stroke-width="3.5" stroke-opacity="0.7" />
    <!-- Lightning fast doodle -->
    <path d="M292 78 L272 112 H296 L280 140" stroke="#FFD93D" stroke-width="7" />
  </g>
</svg>
