    <path d="M104 132 C135 124 265 124 296 132 C328 140 348 210 342 268 C338 302 308 312 286 286 L252 246 H148 L114 286 C92 312 62 302 58 268 C52 210 72 140 104 132 Z" fill="#FFFFFF" />
